<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SKOOTY GO 🛴</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- مكتبة تشغيل الكاميرا وقارئ الـ QR -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: #F5F5F7; overflow: hidden; }
        .app { max-width: 430px; margin: 0 auto; height: 100vh; position: relative; background: white; overflow: hidden; }
        .hidden { display: none !important; }
        
        .input-field { width: 100%; padding: 14px; border: 2px solid #E5E7EB; border-radius: 12px; font-size: 15px; outline: none; margin-bottom: 12px; transition: border 0.3s; }
        .input-field:focus { border-color: #10B981; }
        .btn-primary { width: 100%; padding: 14px; background: #10B981; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; }
        .btn-outline { background: white; color: #10B981; border: 2px solid #10B981; margin-top: 10px; }
        
        .auth-tabs { display: flex; background: #F3F4F6; border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
        .tab-btn { flex: 1; padding: 12px; text-align: center; font-weight: 700; cursor: pointer; color: #6B7280; }
        .tab-btn.active { background: #10B981; color: white; }

        .top-bar { position: absolute; top: 20px; left: 20px; right: 20px; z-index: 1000; display: flex; justify-content: space-between; }
        .wallet-badge { background: white; padding: 10px 16px; font-weight: 700; color: #10B981; border-radius: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); cursor: pointer; }
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        .scan-btn { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: #111827; color: white; padding: 16px 40px; border-radius: 30px; font-size: 18px; font-weight: 800; border: none; box-shadow: 0 8px 24px rgba(0,0,0,0.2); z-index: 1000; cursor: pointer; }

        .overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 2000; display: flex; align-items: flex-end; }
        .modal { background: white; width: 100%; padding: 24px; border-radius: 24px 24px 0 0; max-height: 85vh; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="app">
        <!-- شاشة الدخول -->
        <div class="screen" id="auth-screen" style="padding: 40px 24px; height: 100%; display: flex; flex-direction: column; justify-content: center;">
            <h1 style="color: #10B981; text-align: center; font-size: 45px; margin-bottom: 20px;">SKOOTY GO</h1>
            <div class="auth-tabs">
                <div class="tab-btn active" id="tab-login" onclick="switchTab('login')">تسجيل الدخول</div>
                <div class="tab-btn" id="tab-register" onclick="switchTab('register')">حساب جديد</div>
            </div>

            <div id="form-login">
                <input type="tel" id="login-phone" class="input-field" placeholder="رقم المحمول" maxlength="11">
                <input type="password" id="login-pass" class="input-field" placeholder="كلمة المرور">
                <button class="btn-primary" onclick="submitLogin()" id="btn-login">دخول 🚀</button>
            </div>

            <div id="form-register" class="hidden">
                <input type="text" id="reg-name" class="input-field" placeholder="الاسم بالكامل">
                <input type="tel" id="reg-phone" class="input-field" placeholder="رقم المحمول" maxlength="11">
                <input type="password" id="reg-pass" class="input-field" placeholder="كلمة المرور">
                <button class="btn-primary" onclick="submitRegister()" id="btn-register">إنشاء الحساب ✅</button>
            </div>
            <p id="auth-msg" style="text-align: center; margin-top: 15px; color: #EF4444; font-weight: 600;"></p>
        </div>

        <!-- الشاشة الرئيسية -->
        <div class="screen hidden" id="main-screen">
            <div class="top-bar">
                <div class="wallet-badge" onclick="openTopup()">💳 <span id="wallet-txt">0.00 ج.م</span></div>
            </div>
            <div id="map"></div>
            <button class="scan-btn" onclick="startQRScanner()">📸 امسح للركوب</button>
        </div>

        <!-- نافذة مسح الـ QR والكاميرا الحقيقية -->
        <div class="overlay hidden" id="qr-overlay">
            <div class="modal" style="text-align: center;">
                <h3 style="margin-bottom: 15px; color: #111827;">وجه الكاميرا نحو كود الإسكوتر 📷</h3>
                <div id="reader" style="width: 100%; border-radius: 12px; overflow: hidden;"></div>
                <button class="btn-primary btn-outline" onclick="stopQRScanner()" style="margin-top: 15px;">إغلاق الكاميرا</button>
            </div>
        </div>

        <!-- شحن المحفظة -->
        <div class="overlay hidden" id="topup-overlay">
            <div class="modal">
                <h3 style="margin-bottom: 15px; color: #111827;">شحن المحفظة 💰</h3>
                <select id="topup-method" class="input-field">
                    <option value="إنستاباي">إنستاباي (InstaPay)</option>
                    <option value="فودافون كاش">فودافون كاش</option>
                </select>
                <input type="number" id="topup-amount" class="input-field" placeholder="المبلغ المراد شحنه (ج.م)">
                <button class="btn-primary" onclick="submitTopup()">إرسال طلب الشحن 🚀</button>
                <button class="btn-primary btn-outline" onclick="document.getElementById('topup-overlay').classList.add('hidden')">إلغاء</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API = window.location.origin + "/api";
        let map = null;
        let currentUser = null;
        let html5QrCode = null;

        function switchTab(tab) {
            document.getElementById('auth-msg').innerText = '';
            if (tab === 'login') {
                document.getElementById('tab-login').classList.add('active');
                document.getElementById('tab-register').classList.remove('active');
                document.getElementById('form-login').classList.remove('hidden');
                document.getElementById('form-register').classList.add('hidden');
            } else {
                document.getElementById('tab-register').classList.add('active');
                document.getElementById('tab-login').classList.remove('active');
                document.getElementById('form-register').classList.remove('hidden');
                document.getElementById('form-login').classList.add('hidden');
            }
        }

        async function submitLogin() {
            let phone = document.getElementById('login-phone').value;
            let pass = document.getElementById('login-pass').value;
            let msg = document.getElementById('auth-msg');

            if (!phone || !pass) { msg.innerText = "برجاء إدخال البيانات كاملة"; return; }

            try {
                let res = await fetch(API + '/auth/login', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ phone: phone, password: pass })
                });
                let data = await res.json();
                if (res.ok) { currentUser = data.user; enterApp(); }
                else { msg.innerText = data.error; }
            } catch (e) { msg.innerText = "خطأ في الاتصال بالخادم"; }
        }

        async function submitRegister() {
            let name = document.getElementById('reg-name').value;
            let phone = document.getElementById('reg-phone').value;
            let pass = document.getElementById('reg-pass').value;
            let msg = document.getElementById('auth-msg');

            if (!name || !phone || !pass) { msg.innerText = "برجاء إدخال البيانات كاملة"; return; }

            try {
                let res = await fetch(API + '/auth/register', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ name: name, phone: phone, password: pass })
                });
                let data = await res.json();
                if (res.ok) { currentUser = data.user; enterApp(); }
                else { msg.innerText = data.error; }
            } catch (e) { msg.innerText = "خطأ في الاتصال بالخادم"; }
        }

        function enterApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            updateWalletDisplay();
            setTimeout(() => { initMap(); }, 100);
            
            // تحديث الرصيد أوتوماتيكياً كل 5 ثواني
            setInterval(checkBalance, 5000);
        }

        function updateWalletDisplay() {
            if(currentUser) {
                document.getElementById('wallet-txt').innerText = currentUser.balance.toFixed(2) + ' ج.م';
            }
        }

        async function checkBalance() {
            if(!currentUser) return;
            try {
                let res = await fetch(API + '/user/balance/' + currentUser.id);
                let data = await res.json();
                if(res.ok) {
                    currentUser.balance = data.balance;
                    updateWalletDisplay();
                }
            } catch(e) {}
        }

        function initMap() {
            if(!map) {
                map = L.map('map', {zoomControl: false}).setView([31.2001, 29.9187], 15);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);
                
                let scooterIcon = L.icon({
                    iconUrl: 'https://cdn-icons-png.flaticon.com/512/2972/2972185.png',
                    iconSize: [40, 40],
                    iconAnchor: [20, 40],
                    popupAnchor: [0, -35]
                });

                L.marker([31.2001, 29.9187], {icon: scooterIcon}).addTo(map).bindPopup("<b>إسكوتر #101</b><br>متاح للركوب");
                L.marker([31.2050, 29.9200], {icon: scooterIcon}).addTo(map).bindPopup("<b>إسكوتر #102</b><br>متاح للركوب");
            }
            map.invalidateSize();
        }

        // تشغيل الكاميرا وقارئ الـ QR والتحقق من الرصيد
        function startQRScanner() {
            // التحقق من الرصيد أولاً (الحد الأدنى للركوب مثلاً 10 جنيه)
            if (currentUser.balance < 10) {
                alert('عذراً، رصيدك الحالي لا يكفي لبدء الرحلة (الحد الأدنى 10 ج.م). برجاء شحن المحفظة أولاً! 💳');
                openTopup();
                return;
            }

            document.getElementById('qr-overlay').classList.remove('hidden');
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText, decodedResult) => {
                    stopQRScanner();
                    alert("تم التعرف على الإسكوتر بنجاح: " + decodedText + "\nجاري فتح القفل...");
                },
                (errorMessage) => { /* خطأ في المسح التجريبي يتم تجاهله حتى تلتقط الكاميرا الكود */ }
            ).catch((err) => {
                alert("تعذر تشغيل الكاميرا. تأكد من إعطاء الصلاحية للمتصفح.");
                stopQRScanner();
            });
        }

        function stopQRScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('qr-overlay').classList.add('hidden');
                }).catch(err => {
                    document.getElementById('qr-overlay').classList.add('hidden');
                });
            } else {
                document.getElementById('qr-overlay').classList.add('hidden');
            }
        }

        function openTopup() { document.getElementById('topup-overlay').classList.remove('hidden'); }

        async function submitTopup() {
            let amount = document.getElementById('topup-amount').value;
            let method = document.getElementById('topup-method').value;
            if(!amount || amount <= 0) { alert('برجاء إدخال مبلغ صحيح'); return; }

            try {
                let res = await fetch(API + '/wallet/request_topup', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: currentUser.id, amount: amount, method: method })
                });
                let data = await res.json();
                alert(data.message || "تم إرسال الطلب");
                document.getElementById('topup-overlay').classList.add('hidden');
                document.getElementById('topup-amount').value = '';
            } catch (e) {
                alert("حدث خطأ أثناء إرسال الطلب");
            }
        }
    </script>
</body>
</html>
