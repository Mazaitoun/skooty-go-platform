<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SKOOTY GO 🛴</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: #F5F5F7; overflow: hidden; }
        .app { max-width: 430px; margin: 0 auto; height: 100vh; position: relative; background: white; overflow: hidden; }
        .hidden { display: none !important; }
        
        /* Inputs & Buttons */
        .input-field { width: 100%; padding: 14px; border: 2px solid #E5E7EB; border-radius: 12px; font-size: 15px; outline: none; margin-bottom: 12px; transition: border 0.3s; }
        .input-field:focus { border-color: #10B981; }
        .btn-primary { width: 100%; padding: 14px; background: #10B981; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: background 0.3s; }
        .btn-primary:hover { background: #059669; }
        
        /* Auth Tabs */
        .auth-tabs { display: flex; background: #F3F4F6; border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
        .tab-btn { flex: 1; padding: 12px; text-align: center; font-weight: 700; cursor: pointer; color: #6B7280; transition: 0.3s; }
        .tab-btn.active { background: #10B981; color: white; }

        /* Map UI */
        .top-bar { position: absolute; top: 20px; left: 20px; right: 20px; z-index: 1000; display: flex; justify-content: space-between; }
        .wallet-badge { background: white; padding: 10px 16px; font-weight: 700; color: #10B981; border-radius: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); cursor: pointer; }
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        .scan-btn { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: #111827; color: white; padding: 16px 40px; border-radius: 30px; font-size: 18px; font-weight: 800; border: none; box-shadow: 0 8px 24px rgba(0,0,0,0.2); z-index: 1000; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app">
        <!-- شاشة تسجيل الدخول / إنشاء الحساب -->
        <div class="screen" id="auth-screen" style="padding: 40px 24px; height: 100%; display: flex; flex-direction: column; justify-content: center;">
            <h1 style="color: #10B981; text-align: center; font-size: 45px; margin-bottom: 20px;">SKOOTY GO</h1>
            
            <div class="auth-tabs">
                <div class="tab-btn active" id="tab-login" onclick="switchTab('login')">تسجيل الدخول</div>
                <div class="tab-btn" id="tab-register" onclick="switchTab('register')">حساب جديد</div>
            </div>

            <!-- نموذج تسجيل الدخول -->
            <div id="form-login">
                <input type="tel" id="login-phone" class="input-field" placeholder="رقم المحمول" maxlength="11">
                <input type="password" id="login-pass" class="input-field" placeholder="كلمة المرور">
                <button class="btn-primary" onclick="submitLogin()" id="btn-login">دخول 🚀</button>
            </div>

            <!-- نموذج إنشاء حساب -->
            <div id="form-register" class="hidden">
                <input type="text" id="reg-name" class="input-field" placeholder="الاسم بالكامل">
                <input type="tel" id="reg-phone" class="input-field" placeholder="رقم المحمول" maxlength="11">
                <input type="password" id="reg-pass" class="input-field" placeholder="كلمة المرور">
                <button class="btn-primary" onclick="submitRegister()" id="btn-register">إنشاء الحساب ✅</button>
            </div>
            
            <p id="auth-msg" style="text-align: center; margin-top: 15px; color: #EF4444; font-weight: 600;"></p>
        </div>

        <!-- الشاشة الرئيسية (الخريطة) -->
        <div class="screen hidden" id="main-screen">
            <div class="top-bar">
                <div class="wallet-badge" onclick="alert('شحن المحفظة قريباً')">💳 <span id="wallet-txt">0.00 ج.م</span></div>
            </div>
            <div id="map"></div>
            <button class="scan-btn" onclick="alert('سكانر الإسكوتر')">📸 امسح للركوب</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API = window.location.origin + "/api";
        let map = null;
        let currentUser = null;

        function switchTab(tab) {
            document.getElementById('auth-msg').innerText = '';
            if (tab === 'login') {
                document.getElementById('tab-login').classList.add('active');
                document.getElementById('tab-register').classList.remove('active');
                document.getElementById('form-login').classList.remove('hidden');
                document.getElementById('form-register').classList.add('hidden');
            } else {
                document.getElementById('tab-register').classList.add('active');
                document.getElementById('tab-login').classList.remove('active');
                document.getElementById('form-register').classList.remove('hidden');
                document.getElementById('form-login').classList.add('hidden');
            }
        }

        async function submitLogin() {
            let phone = document.getElementById('login-phone').value;
            let pass = document.getElementById('login-pass').value;
            let msg = document.getElementById('auth-msg');
            let btn = document.getElementById('btn-login');

            if (!phone || !pass) { msg.innerText = "برجاء إدخال رقم المحمول وكلمة المرور"; return; }

            btn.innerText = "جاري الدخول...";
            try {
                let res = await fetch(API + '/auth/login', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ phone: phone, password: pass })
                });
                let data = await res.json();
                
                if (res.ok) {
                    currentUser = data.user;
                    enterApp();
                } else {
                    msg.innerText = data.error || "خطأ في تسجيل الدخول";
                    btn.innerText = "دخول 🚀";
                }
            } catch (e) {
                msg.innerText = "خطأ في الاتصال بالخادم";
                btn.innerText = "دخول 🚀";
            }
        }

        async function submitRegister() {
            let name = document.getElementById('reg-name').value;
            let phone = document.getElementById('reg-phone').value;
            let pass = document.getElementById('reg-pass').value;
            let msg = document.getElementById('auth-msg');
            let btn = document.getElementById('btn-register');

            if (!name || !phone || !pass) { msg.innerText = "برجاء استكمال جميع البيانات"; return; }

            btn.innerText = "جاري الإنشاء...";
            try {
                let res = await fetch(API + '/auth/register', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ name: name, phone: phone, password: pass })
                });
                let data = await res.json();
                
                if (res.ok) {
                    currentUser = data.user;
                    enterApp();
                } else {
                    msg.innerText = data.error || "خطأ أثناء إنشاء الحساب";
                    btn.innerText = "إنشاء الحساب ✅";
                }
            } catch (e) {
                msg.innerText = "خطأ في الاتصال بالخادم";
                btn.innerText = "إنشاء الحساب ✅";
            }
        }

        function enterApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            document.getElementById('wallet-txt').innerText = currentUser.balance + ' ج.م';
            
            setTimeout(() => { initMap(); }, 100);
        }

        function initMap() {
            if(!map) {
                map = L.map('map', {zoomControl: false}).setView([31.2001, 29.9187], 15);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);
                let scooterIcon = L.icon({ iconUrl: 'https://cdn-icons-png.flaticon.com/512/3752/3752766.png', iconSize: [45, 45], iconAnchor: [22, 45] });
                L.marker([31.2001, 29.9187], {icon: scooterIcon}).addTo(map);
                L.marker([31.2050, 29.9200], {icon: scooterIcon}).addTo(map);
            }
            map.invalidateSize();
        }
    </script>
</body>
</html>
